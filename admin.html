<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المسلم</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f7f3;
      color: #173d2c;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px #00000012;
    }

    h1, h2 { text-align: center; }

    input, textarea, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input, textarea {
      border: 1px solid #ccc;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: none;
      background: #176b45;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #105536; }

    .delete { background: #b83232; }
    .secondary { background: #555; }

    .hidden { display: none; }

    .item {
      border: 1px solid #ddd;
      padding: 12px;
      margin-top: 12px;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    #message {
      text-align: center;
      margin: 12px 0;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🕌 AL-Moslim</h1>
  <h2>لوحة التحكم</h2>

  <div id="login">
    <h3>تسجيل دخول المدير</h3>
    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" placeholder="كلمة المرور">
    <button id="loginBtn">دخول</button>
  </div>

  <div id="dashboard" class="hidden">
    <h3>إدارة محتوى الموقع</h3>

    <input id="docId" placeholder="معرّف المحتوى (مثلاً: home)">
    <input id="title" placeholder="العنوان">
    <textarea id="content" placeholder="اكتب المحتوى هنا"></textarea>

    <button id="saveBtn">حفظ المحتوى</button>
    <button id="clearBtn" class="secondary">تفريغ الخانات</button>

    <h3>المحتويات المحفوظة</h3>
    <div id="items"></div>

    <button id="logoutBtn" class="delete">تسجيل الخروج</button>
  </div>

  <p id="message"></p>
</div>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc,
    deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPh3WscZj2QGxDBGfqDBJtJsYw_JZ_gxA",
    authDomain: "al-muslim-28cf7.firebaseapp.com",
    projectId: "al-muslim-28cf7",
    storageBucket: "al-muslim-28cf7.firebasestorage.app",
    messagingSenderId: "673582048508",
    appId: "1:673582048508:web:b732dbbb07a0e4f7486379"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = id => document.getElementById(id);

  function message(text) {
    $("message").textContent = text;
  }

  $("loginBtn").onclick = async () => {
    try {
      await signInWithEmailAndPassword(
        auth,
        $("email").value.trim(),
        $("password").value
      );
      message("تم تسجيل الدخول بنجاح");
    } catch (error) {
      message("تعذّر تسجيل الدخول: " + error.message);
    }
  };

  onAuthStateChanged(auth, user => {
    $("login").classList.toggle("hidden", !!user);
    $("dashboard").classList.toggle("hidden", !user);

    if (user) loadContent();
  });

  async function loadContent() {
    $("items").innerHTML = "جاري تحميل المحتوى...";

    try {
      const snapshot = await getDocs(collection(db, "site_content"));
      $("items").innerHTML = "";

      snapshot.forEach(documentSnapshot => {
        const data = documentSnapshot.data();

        const box = document.createElement("div");
        box.className = "item";

        const heading = document.createElement("h4");
        heading.textContent = data.title || documentSnapshot.id;

        const description = document.createElement("p");
        description.textContent = data.content || "";

        const edit = document.createElement("button");
        edit.textContent = "تعديل";
        edit.onclick = () => {
          $("docId").value = documentSnapshot.id;
          $("title").value = data.title || "";
          $("content").value = data.content || "";
          window.scrollTo(0, 0);
        };

        const remove = document.createElement("button");
        remove.textContent = "حذف";
        remove.className = "delete";
        remove.onclick = async () => {
          if (!confirm("هل أنت متأكد من حذف هذا المحتوى؟")) return;

          try {
            await deleteDoc(doc(db, "site_content", documentSnapshot.id));
            message("تم الحذف");
            loadContent();
          } catch (error) {
            message("خطأ: " + error.message);
          }
        };

        box.append(heading, description, edit, remove);
        $("items").appendChild(box);
      });

      if (!snapshot.size) {
        $("items").textContent = "لا يوجد محتوى محفوظ.";
      }

    } catch (error) {
      message("خطأ في تحميل المحتوى: " + error.message);
    }
  }
