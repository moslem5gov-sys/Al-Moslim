<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AL-Moslim | Admin</title>
<style>
body{font-family:Arial;background:#f1f5f1;margin:0;padding:20px;color:#17432e}
.box{max-width:600px;margin:30px auto;background:white;padding:22px;border-radius:15px}
h2{text-align:center}
input,textarea,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;font-size:16px}
input,textarea{border:1px solid #ccc}
textarea{min-height:110px}
button{background:#176b45;color:white;border:0;font-weight:bold}
.delete{background:#b83232}
.hidden{display:none}
.item{border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:8px}
#message{overflow-wrap:anywhere;text-align:center}
</style>
</head>
<body>

<div class="box">
<h2>🕌 AL-Moslim</h2>
<h2>لوحة تحكم المدير</h2>

<div id="login">
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">دخول</button>
</div>

<div id="dashboard" class="hidden">
<h3>إضافة أو تعديل محتوى</h3>
<input id="docId" placeholder="معرّف المحتوى مثل home">
<input id="title" placeholder="العنوان">
<textarea id="content" placeholder="المحتوى"></textarea>
<button id="saveBtn">حفظ المحتوى</button>
<button id="clearBtn">تفريغ الخانات</button>
<h3>المحتويات الموجودة</h3>
<div id="items"></div>
<button id="logoutBtn" class="delete">تسجيل الخروج</button>
</div>

<p id="message"></p>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
doc,
setDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDPh3WscZj2QGxDBGfqDBJtJsYw_JZ_gxA",
authDomain: "al-muslim-28cf7.firebaseapp.com",
projectId: "al-muslim-28cf7",
storageBucket: "al-muslim-28cf7.firebasestorage.app",
messagingSenderId: "673582048508",
appId: "1:673582048508:web:b732dbbb07a0e4f7486379"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

function showMessage(text){
$("message").textContent = text;
}

$("loginBtn").addEventListener("click", async () => {
showMessage("جاري تسجيل الدخول...");
try {
await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);
showMessage("تم تسجيل الدخول بنجاح");
} catch(error) {
showMessage("خطأ في الدخول: " + error.message);
}
});

onAuthStateChanged(auth, user => {
$("login").classList.toggle("hidden", !!user);
$("dashboard").classList.toggle("hidden", !user);
if(user) loadContent();
});

async function loadContent(){
$("items").textContent = "جاري التحميل...";
try {
const result = await getDocs(collection(db,"site_content"));
$("items").innerHTML = "";

result.forEach(item => {
const data = item.data();
const box = document.createElement("div");
box.className = "item";

const title = document.createElement("h3");
title.textContent = data.title || item.id;

const content = document.createElement("p");
content.textContent = data.content || "";

const edit = document.createElement("button");
edit.textContent = "تعديل";
edit.onclick = () => {
$("docId").value = item.id;
$("title").value = data.title || "";
$("content").value = data.content || "";
};

const remove = document.createElement("button");
remove.textContent = "حذف";
remove.className = "delete";
remove.onclick = async () => {
if(confirm("هل تريد حذف هذا المحتوى؟")){
try {
await deleteDoc(doc(db,"site_content",item.id));
showMessage("تم الحذف");
loadContent();
} catch(error) {
showMessage("خطأ: " + error.message);
}
}
};

box.append(title,content,edit,remove);
$("items").appendChild(box);
});

if(result.empty) $("items").textContent = "لا يوجد محتوى.";

} catch(error) {
showMessage("خطأ في تحميل المحتوى: " + error.message);
}
}

$("saveBtn").addEventListener("click", async () => {
const id = $("docId").value.trim();
if(!id){
showMessage("اكتب معرّف المحتوى أولاً");
return;
}

try {
await setDoc(doc(db,"site_content",id),{
title: $("title").value.trim(),
content: $("content").value.trim()
});
showMessage("تم حفظ المحتوى بنجاح");
$("docId").value = "";
$("title").value = "";
$("content").value = "";
loadContent();
} catch(error) {
showMessage("خطأ في الحفظ: " + error.message);
}
});

$("clearBtn").onclick = () => {
$("docId").value = "";
$("title").value = "";
$("content").value = "";
};

$("logoutBtn").onclick = () => signOut(auth);
</script>

</body>
</html>
